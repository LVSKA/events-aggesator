services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: events_aggregator
      POSTGRES_USER: events_aggregator
      POSTGRES_PASSWORD: events_aggregator
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data:
