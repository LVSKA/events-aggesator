[project]
name = "events-aggregator"
version = "0.1.0"
description = "Aggregator service wrapping the Events Provider API"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "celery>=5.4",
    "kombu[sqlalchemy]>=5.4",
    "psycopg[binary]>=3.1",
    "psycopg2-binary>=2.9",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/core/settings/local.py" = ["F403", "F405"]
"src/core/settings/prod.py" = ["F403", "F405"]
"src/core/settings/test.py" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings.test"
pythonpath = ["src"]
testpaths = ["src"]
python_files = ["test_*.py"]
